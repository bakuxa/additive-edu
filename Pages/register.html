<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Регистрация | Аддитивные технологии</title>
    <link rel="stylesheet" href="register.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        
        <div class="vector-bg"><img src="/Pages/img/Vector1.png"></div>
        <div class="logo">
            <img src="/Pages/img/logo.png" alt="Логотип">
        </div>
        
        <div class="hero-text">
            Прокачай свой уровень в <span class="gradient-text">аддитивных технологиях</span>
        </div>
        
       <div class="main-image">
            <img src="/Pages/img/photo2.png" alt="3D печать">
            <div class="image-caption">
                <span>Станьте специалистом <br>в области 3D-печати</span>
            </div>
        </div>
    
        <div class="register-card">
            <h1 class="register-title">Регистрация</h1>
            <p class="register-subtitle">Создайте аккаунт, чтобы изучать теорию, проходить адаптивные тесты, работать с симуляторами и получать достижения</p>
            
            <div class="input-field">
                <label for="surname">Фамилия</label>
                <input type="text" id="surname" name="surname" placeholder="Иванов" autocomplete="family-name">
            </div>
            
            <div class="input-field">
                <label for="name">Имя</label>
                <input type="text" id="name" name="name" placeholder="Иван" autocomplete="given-name">
            </div>
            
            <div class="input-field">
                <label for="patronymic">Отчество</label>
                <input type="text" id="patronymic" name="patronymic" placeholder="Иванович" autocomplete="additional-name">
            </div>
            
            <div class="input-field">
                <label for="group">Группа</label>
                <input type="text" id="group" name="group" placeholder="БС-01-23" autocomplete="off">
            </div>
            
            <div class="input-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" autocomplete="email">
            </div>
            
            <div class="input-field">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67" autocomplete="tel">
            </div>
            
            <div class="input-field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password">
            </div>
            
            <button class="register-btn-main" id="registerBtn">Зарегистрироваться</button>
            
            <p class="login-prompt">Уже есть аккаунт? Вернитесь на страницу входа</p>
            
            <button class="login-btn" id="loginBtn">Войти в аккаунт</button>
        </div>
    
    </div>
</body>
</html>
